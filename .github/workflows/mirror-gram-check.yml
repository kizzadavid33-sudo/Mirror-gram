name: Mirror Gram - Install and Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://fkbbpovlhrpbclnmmtbu.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8leNijHqCZ2QQKzmKyysMQ_57tRVsGK
    steps:
      - name: Checkout Mirror Gram
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck web app
        run: npm run typecheck:web
      - name: Build web app
        run: npm run build:web
      - name: Package Mirror Gram
        if: success()
        run: |
          zip -r Mirror_Gram_WHOLE_APP_SO_FAR.zip . \
            -x ".git/*" "node_modules/*" "apps/web/node_modules/*" "apps/mobile/node_modules/*" ".next/*"

      - name: Upload Mirror Gram ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mirror_Gram_WHOLE_APP_SO_FAR
          path: Mirror_Gram_WHOLE_APP_SO_FAR.zip
          retention-days: 7
