name: Mirror Gram Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mirror-gram-android.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout Mirror Gram
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Install Android native project
        run: CI=1 npx expo prebuild --platform android

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mirror_Gram_Android_APK
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mirror-gram-apk-${{ github.run_number }}
          name: Mirror Gram APK ${{ github.run_number }}
          body: |
            Mirror Gram Android APK built from commit ${{ github.sha }}.
          files: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
