name: Mirror Gram web build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  web-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck web
        run: npm run typecheck:web

      - name: Build web
        run: npm run build:web

      - name: Package whole Mirror Gram app
        if: success()
        run: |
          zip -r Mirror_Gram_WHOLE_APP_FINAL.zip .             -x ".git/*" "node_modules/*" "apps/web/node_modules/*" "apps/mobile/node_modules/*" "apps/web/.next/*" ".next/*"

      - name: Upload whole-app ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mirror_Gram_WHOLE_APP_FINAL
          path: Mirror_Gram_WHOLE_APP_FINAL.zip
          retention-days: 14
