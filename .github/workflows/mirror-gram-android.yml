name: Mirror Gram Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mirror-gram-android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout Mirror Gram
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Install Android native project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Mirror Gram APK
        uses: actions/upload-artifact@v4
        with:
          name: Mirror_Gram_Android_APK
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
